<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리빙 비세토스 — 운영 대시보드</title>
<link rel="icon" href="data:,">
<link rel="preload" href="/assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<a class="skipLink" href="#resultsPanel">본문으로 건너뛰기</a>

<header class="topBar">
  <div class="topBarInner">
    <div class="brand">
      <span class="brandMark" aria-hidden="true">LV</span>
      <span class="brandText">
        <b>운영 대시보드</b>
        <i>Living Visetos</i>
      </span>
    </div>

    <div class="topControls">
      <label class="field field--token" for="adminToken">
        <span class="fieldLabel">운영 토큰</span>
        <input id="adminToken" type="password" autocomplete="off" placeholder="RESULT_ADMIN_TOKEN" spellcheck="false">
      </label>
      <label class="field field--code" for="codeSearch">
        <span class="fieldLabel">세션 코드</span>
        <input id="codeSearch" type="search" autocomplete="off" placeholder="ABCD-1234" spellcheck="false">
      </label>
      <div class="topActions">
        <button class="btn btn--primary" id="searchButton" type="button">상세 조회</button>
        <button class="btn" id="refreshButton" type="button">새로고침</button>
      </div>
    </div>

    <nav class="topLinks" aria-label="다른 화면으로 이동">
      <a href="/drop.html">드랍</a>
      <a href="/membership.html">멤버십</a>
      <a href="/">키오스크</a>
    </nav>
  </div>
  <p class="statusBand" id="statusBand" role="status" aria-live="polite">운영 토큰을 입력하면 최근 결과를 불러옵니다.</p>
</header>

<main class="workspace">
  <section class="panel panel--list" id="resultsPanel" aria-labelledby="listTitle">
    <div class="panelHead">
      <div class="panelTitle">
        <h2 id="listTitle">최근 결과</h2>
        <span class="countChip" id="resultCount" hidden></span>
      </div>
      <div class="pager">
        <span class="pagerRange" id="pagerRange" aria-live="polite"></span>
        <button class="btn btn--icon" id="prevButton" type="button" aria-label="이전 페이지">←</button>
        <button class="btn btn--icon" id="nextButton" type="button" aria-label="다음 페이지">→</button>
      </div>
    </div>
    <div class="tableHead" aria-hidden="true">
      <span>코드</span>
      <span>패턴</span>
      <span>발급 시각</span>
      <span>에셋</span>
      <span>주문</span>
    </div>
    <div class="tableBody" id="resultList" role="list"></div>
  </section>

  <section class="panel panel--detail" aria-labelledby="detailTitle">
    <div class="panelHead">
      <div class="panelTitle">
        <h2 id="detailTitle">선택 결과</h2>
        <span class="countChip countChip--ghost" id="detailCode" hidden></span>
      </div>
      <span class="ttlChip" id="ttlChip" hidden></span>
    </div>
    <div class="detailBody" id="detailContent"></div>
  </section>
</main>

<div class="toastStack" id="toastStack" aria-live="assertive" aria-atomic="true"></div>

<script type="module" src="/src/admin/main.ts"></script>
</body>
</html>
